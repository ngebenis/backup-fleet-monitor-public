server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  # TLS/HSTS: set Strict-Transport-Security at the edge (F5 / FortiWeb / Cloudflare).
  # Behind F5 / FortiWeb / Cloudflare every request arrives from the proxy's IP.
  # Uncomment and list your proxy ranges so rate limiting and audit logs record the
  # real client address (Cloudflare: use CF-Connecting-IP instead of X-Forwarded-For).
  # Only trust ranges you control; a wrong range lets clients spoof their IP.
  # set_real_ip_from 192.0.2.0/24;
  # real_ip_header X-Forwarded-For;
  # real_ip_recursive on;
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 60s;
  }
  location = /healthz { proxy_pass http://api:8080; }
  location /assets/ { add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always; add_header Cache-Control "public, max-age=31536000, immutable" always; add_header X-Content-Type-Options nosniff always; }
  location / { add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always; add_header Referrer-Policy same-origin always; add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options DENY always; try_files $uri /index.html; }
}
